name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.2.0 or 2.2.0-beta3)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true
      flavor:
        description: 'Build flavor'
        required: true
        type: choice
        options:
          - github
          - playstore
          - both
        default: 'both'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintGithubDebug --stacktrace

      - name: Build GitHub Release APK
        if: inputs.flavor == 'github' || inputs.flavor == 'both'
        run: ./gradlew assembleGithubRelease --stacktrace
        env:
          HEADUNIT_KEYSTORE_PASSWORD: ${{ secrets.HEADUNIT_KEYSTORE_PASSWORD }}
          HEADUNIT_KEY_PASSWORD: ${{ secrets.HEADUNIT_KEY_PASSWORD }}

      - name: Build Playstore Release APK
        if: inputs.flavor == 'playstore' || inputs.flavor == 'both'
        run: ./gradlew assemblePlaystoreRelease --stacktrace
        env:
          HEADUNIT_KEYSTORE_PASSWORD: ${{ secrets.HEADUNIT_KEYSTORE_PASSWORD }}
          HEADUNIT_KEY_PASSWORD: ${{ secrets.HEADUNIT_KEY_PASSWORD }}

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk -name "*.apk" -path "*/release/*" -exec cp {} release-artifacts/ \;
          ls -lh release-artifacts/
          [ "$(ls -A release-artifacts/)" ] || { echo "ERROR: No release APKs found"; exit 1; }

      - name: Create GitHub Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: true
          files: release-artifacts/*.apk
          body: |
            ## What's Changed

            <!-- Add release notes here -->

            ### Installation
            - **GitHub flavor**: For devices with Android 4.1+ (API 16+)
            - **Playstore flavor**: For devices with Android 5.0+ (API 21+)

            ### Checksums
            ```
            $(cd release-artifacts && sha256sum *.apk)
            ```

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ inputs.version }}
          path: release-artifacts/*.apk
          retention-days: 90
